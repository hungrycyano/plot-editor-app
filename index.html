<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>plot-editor</title>
<meta name="description" content="小説のプロット（骨組み）を作るツール">
<meta name="theme-color" content="#34506b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="plot-editor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
<script src="lib/marked.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<header id="topbar">
  <button id="menuBtn" type="button" class="icon" aria-label="メニュー" aria-expanded="false" aria-controls="menu">☰</button>
  <div class="doc-title"><span id="docName"></span> <span id="dirtyMark" class="dirty" hidden>● 未保存</span></div>
  <div class="mobile-switch" role="tablist">
    <button type="button" data-pane="left">表示</button>
    <button type="button" data-pane="right">入力</button>
  </div>
  <button id="saveBtn" type="button" class="primary">保存</button>
  <nav id="menu" hidden></nav>
</header>
<div id="updateBar" hidden>新しい版に更新されました。 <button id="updateReload" type="button" class="small">再読み込み</button></div>
<main id="main">
  <section id="left" class="pane" aria-label="表示">
    <nav class="tabs" id="leftTabs" role="tablist"></nav>
    <div class="pane-body" id="leftBody"></div>
  </section>
  <div id="splitter" role="separator" aria-orientation="vertical" title="ドラッグで幅を変更"></div>
  <section id="right" class="pane" aria-label="入力・編集">
    <nav class="tabs" id="rightTabs" role="tablist"></nav>
    <div class="pane-body" id="rightBody"></div>
  </section>
</main>
<dialog id="dialog"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
</body>
</html>
